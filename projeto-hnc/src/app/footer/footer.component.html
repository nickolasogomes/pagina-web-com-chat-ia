<footer class="footer sm:footer-horizontal bg-neutral text-neutral-content p-10">
    <aside>
        <img src="/assets/img/logoWhite.svg" alt="Logo da Empresa" class="w-20 h-20 ml-8 object-contain" />
        <p>
            HNC Maternity
            <br />
            Providing reliability since
        </p>
    </aside>
    <nav>
        <h6 class="footer-title">Social</h6>
        <div class="grid grid-flow-col gap-4">
            <a>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="fill-current">
                    <path
                        d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z">
                    </path>
                </svg>
            </a>
            <a>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="fill-current">
                    <path
                        d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z">
                    </path>
                </svg>
            </a>
            <a>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="fill-current">
                    <path
                        d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z">
                    </path>
                </svg>
            </a>
        </div>
    </nav>

    <aside class="container mx-auto sm:px-6 md:px-8 lg:px-0 max-w-md flex flex-col items-center justify-center">
        <h6 class="footer-title self-start ml-10 sm:ml-6 md:ml-8">Não perca as novidades! Inscreva-se</h6>

        <form #form="ngForm" (ngSubmit)="onSubmit(form)"
            class="flex flex-col space-y-4 w-full max-w-sm p-2 rounded-lg shadow-lg">

            <div class="join w-full flex flex-col">
                <input type="text" name="name" [(ngModel)]="user.name" required minlength="2"
                    class="input input-bordered w-full" placeholder="Nome" #name="ngModel" />
                <span *ngIf="(name.invalid && (name.dirty || name.touched)) || (form.submitted && name.invalid)"
                    class="text-red-600 text-sm mt-1">
                    Nome deve ter pelo menos 2 letras.
                </span>
            </div>

            <div class="join w-full flex flex-col">
                <input type="email" name="email" [(ngModel)]="user.email" required class="input input-bordered w-full"
                    placeholder="Email" #email="ngModel" />
                <span *ngIf="email.invalid && (email.dirty || email.touched)" class="text-red-600 text-sm mt-1">
                    Email inválido.
                </span>
            </div>

            <div class="join w-full flex flex-col">
                <input type="text" name="phone" [(ngModel)]="user.phone" required pattern="\(?\d{2}\)?\s?9\d{4}-\d{4}"
                    class="input input-bordered w-full" placeholder="Telefone" #phone="ngModel" />
                <span *ngIf="(phone.invalid && (phone.dirty || phone.touched)) || (form.submitted && phone.invalid)"
                    class="text-red-600 text-sm mt-1">
                    Telefone inválido. Ex: (11) 91234-5678
                </span>
            </div>

            <button class="btn btn-sm rounded-full text-black bg-white self-center px-6" [disabled]="form.invalid">
                Subscribe
            </button>

        </form>
    </aside>



</footer>
